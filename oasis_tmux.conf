# oasis_tmux.conf
# Main theme loader with automatic variant selection

# Default to moonlight_dark if user hasn't specified a flavor
set -ogq @oasis_flavor "moonlight_dark"

# Mode format: "short" (single letter), "full" (complete word), "icon" (Nerd Font icons), or "custom" (user-defined)
set -ogq @oasis_mode_format "full"

# Dim unfocused panes to the darkest background: "on" or "off"
set -ogq @oasis_dim_inactive "on"

# Mark the focused pane: "header" (a title bar on each pane, accent on the focused one) or "arrows" (an arrow pointing into it)
# TODO: tmux PR #5433 (https://github.com/tmux/tmux/pull/5433) adds a `per-pane-border` window option that boxes every pane.
# Once it ships, header mode and its hook can be replaced by a version-gated `setw -g per-pane-border on`.
set -ogq @oasis_pane_borders "header"
set -ogq @oasis_pane_border_format " #{pane_current_command} "

# Custom mode labels (only used when @oasis_mode_format is "custom")
# Users can override any of these to customize the mode indicator
set -ogq @oasis_mode_custom_normal "NORMAL"
set -ogq @oasis_mode_custom_command "COMMAND"
set -ogq @oasis_mode_custom_copy "COPY"
set -ogq @oasis_mode_custom_view "VIEW"
set -ogq @oasis_mode_custom_choose "CHOOSE"
set -ogq @oasis_mode_custom_options "OPTIONS"
set -ogq @oasis_mode_custom_clock "CLOCK"
set -ogq @oasis_mode_custom_zoom "ZOOM"

# Normalize flavor name - append _dark suffix if no variant specified for dual-mode themes
# Dual-mode themes: abyss, cactus, canyon, desert, dune, lagoon, luna, mirage, midnight, moonlight, night, rose, scorpion, sol, starlight, twilight
# Single-mode themes: dawn, dawnlight, day, dusk, dust
%hidden OASIS_FLAVOR="#{@oasis_flavor}"
%if "#{m/r:^(abyss|cactus|canyon|desert|dune|lagoon|luna|mirage|midnight|moonlight|night|rose|scorpion|sol|starlight|twilight)$,#{@oasis_flavor}}"
  set -gF @oasis_flavor "#{@oasis_flavor}_dark"
%endif

# Determine theme path based on variant type
# Dark themes: themes/dark/oasis_*_dark.conf
# Light themes: themes/light/N/oasis_*_light_N.conf
%if "#{m/r:_dark$,#{@oasis_flavor}}"
  set -gF @oasis_theme_path "#{d:current_file}/themes/dark/oasis_#{@oasis_flavor}.conf"
%elif "#{m/r:_light_([1-5])$,#{@oasis_flavor}}"
  set -gF @oasis_theme_path "#{d:current_file}/themes/light/#{s/.*_light_([1-5])$/\\1/:@oasis_flavor}/oasis_#{@oasis_flavor}.conf"
%else
  set -gF @oasis_theme_path "#{d:current_file}/themes/dark/oasis_#{@oasis_flavor}.conf"
%endif

# Theme files set colours with -o, so clear the previous flavour's before loading another
run-shell 'tmux show -g | awk "/^@thm_/ {print \$1}" | while read -r o; do tmux set -gu "$o"; done'

# Load the selected theme variant
source -F "#{@oasis_theme_path}"

# Basic tmux styling
set -gF message-style "fg=#{@thm_primary},bg=#{@thm_mantle},fill=#{@thm_mantle}"
set -gF message-command-style "fg=#{@thm_secondary},bg=#{@thm_mantle},fill=#{@thm_mantle}"

# Mode styling
set -gF mode-style "bg=#{@thm_visual},fg=#{@thm_fg},bold"
set -gF clock-mode-colour "#{@thm_blue}"

# Menu styling (tmux 3.4+)
%if "#{>=:#{version},3.4}"
  set -gF menu-selected-style "fg=#{@thm_fg},bold,bg=#{@thm_surface}"
%endif

# Popup styling (tmux 3.4+)
%if "#{>=:#{version},3.4}"
  set -gF popup-style "bg=#{@thm_core},fg=#{@thm_fg}"
  set -gF popup-border-style "fg=#{@thm_surface}"
%endif

# Pane border styling: the active pane gets an accent border, plus a header bar or an arrow
setw -g pane-border-status off
setw -g pane-border-lines single
%if "#{==:#{@oasis_pane_borders},arrows}"
  set -gF @oasis_pane_active_fg "#{@thm_secondary}"
%else
  set -gF @oasis_pane_active_fg "#{@thm_primary}"
%endif
%if "#{==:#{@oasis_dim_inactive},on}"
  setw -g window-style "bg=#{@thm_crust}"
  setw -g window-active-style "bg=terminal"
  %if "#{==:#{@oasis_pane_borders},arrows}"
    setw -g pane-border-style "bg=#{@thm_crust},fg=#{@thm_crust}"
  %else
    setw -g pane-border-style "bg=#{@thm_crust},fg=#{@thm_surface}"
  %endif
  setw -g pane-active-border-style "bg=#{@thm_crust},fg=#{@oasis_pane_active_fg},bold"
%else
  setw -g pane-border-style "bg=#{@thm_mantle},fg=#{@thm_surface}"
  setw -g pane-active-border-style "bg=#{@thm_mantle},fg=#{@oasis_pane_active_fg},bold"
%endif

%if "#{==:#{@oasis_pane_borders},arrows}"
  setw -g pane-border-format ""
  # Arrows instead of half-coloured borders, which are ambiguous in a two-pane split (tmux 3.3+)
  %if "#{>=:#{version},3.3}"
    setw -g pane-border-indicators arrows
  %endif
  # Drop header mode's hook and per-window values, in case it was loaded before
  set-hook -gu 'window-layout-changed[9210]'
  run-shell 'tmux list-windows -a -F "##{window_id}" | while read -r w; do tmux set -wu -t "$w" pane-border-status; done'
%else
  setw -g pane-border-format "#{?pane_active,#[fg=#{@oasis_pane_active_fg}]#[bold]#{E:@oasis_pane_border_format},#[fg=#{@thm_surface}]#{E:@oasis_pane_border_format}}"
  %if "#{>=:#{version},3.3}"
    setw -g pane-border-indicators off
  %endif
  # pane-border-status is a window option and not a format, and tmux draws the header
  # for a lone or zoomed pane too, so each window gets its own value whenever its
  # layout changes (split, kill, exit, zoom, join, break). The fixed hook index keeps
  # reloads from stacking duplicates and leaves other plugins' hooks alone.
  # TODO: replace with a version-gated `setw -g per-pane-border on` once
  # https://github.com/tmux/tmux/pull/5433 ships.
  set -g @oasis_pane_border_status "#{?#{&&:#{>:#{window_panes},1},#{!:#{window_zoomed_flag}}},top,off}"
  set-hook -g 'window-layout-changed[9210]' 'set -wF pane-border-status "#{E:@oasis_pane_border_status}"'
  run-shell 'tmux list-windows -a -F "##{window_id}" | while read -r w; do tmux set -wF -t "$w" pane-border-status "##{E:@oasis_pane_border_status}"; done'
%endif

# Load status line configuration
source -F "#{d:current_file}/status/status_line.conf"
