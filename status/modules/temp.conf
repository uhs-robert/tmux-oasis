# status/modules/temp.conf
# vim:set ft=tmux:
# CPU temperature on Linux. Hidden on macOS and without a recognised CPU sensor.

# User configurable settings
set -ogq @oasis_temp_icon "\357\213\211 "
set -ogq @oasis_temp_warn "70" # Degrees Celsius
set -ogq @oasis_temp_crit "80"

set -ogq @oasis_module_temp '#{@oasis_temp_icon}#(bash #{q:@oasis_scripts_dir}/temp.sh text)'
set -ogq @oasis_module_temp_when '#{!=:#(bash #{q:@oasis_scripts_dir}/temp.sh text),}'
set -ogq @oasis_module_temp_state '#(bash #{q:@oasis_scripts_dir}/temp.sh state)'
