# status/modules/application.conf
# vim:set ft=tmux:
# Program running in the active pane. Hidden while the pane runs a shell.

# User configurable settings
set -ogq @oasis_application_icon "\363\260\243\206 "
# Panes whose command matches are hidden; empty shows every command
set -ogq @oasis_application_hidden_regex "^-?(bash|zsh|fish|sh|dash)$"

set -ogq @oasis_module_application "#{@oasis_application_icon}#{=15:pane_current_command}"
set -ogq @oasis_module_application_when "#{?#{&&:#{!=:#{@oasis_application_hidden_regex},},#{m/r:#{@oasis_application_hidden_regex},#{pane_current_command}}},0,1}"
