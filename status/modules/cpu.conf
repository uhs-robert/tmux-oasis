# status/modules/cpu.conf
# vim:set ft=tmux:
# CPU usage percent since the previous refresh

# User configurable settings
set -ogq @oasis_cpu_icon " "
set -ogq @oasis_cpu_warn "70" # Percent
set -ogq @oasis_cpu_crit "90"

set -ogq @oasis_module_cpu '#{@oasis_cpu_icon}#(bash "#{@oasis_scripts_dir}/cpu.sh" display)'
set -ogq @oasis_module_cpu_when '#(bash "#{@oasis_scripts_dir}/cpu.sh" display)'
set -ogq @oasis_module_cpu_state '#(bash "#{@oasis_scripts_dir}/cpu.sh" state)'
