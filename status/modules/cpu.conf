# status/modules/cpu.conf
# vim:set ft=tmux:
# CPU usage percent since the previous refresh

# User configurable settings
set -ogq @oasis_cpu_icon "\357\213\233 "
set -ogq @oasis_cpu_warn "70" # Percent
set -ogq @oasis_cpu_crit "90"

set -ogq @oasis_module_cpu '#{@oasis_cpu_icon}#(bash #{q:@oasis_scripts_dir}/cpu.sh display)'
set -ogq @oasis_module_cpu_when '#(bash #{q:@oasis_scripts_dir}/cpu.sh display)'
set -ogq @oasis_module_cpu_state '#(bash #{q:@oasis_scripts_dir}/cpu.sh state)'
