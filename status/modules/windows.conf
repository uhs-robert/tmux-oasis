# status/modules/windows.conf
# vim:set ft=tmux:
# Window pill text; status/build_status.sh adds the caps and colours

set -ogq @oasis_module_window_inactive " #I#{?#{!=:#{window_name},Window}, #W,}"
set -ogq @oasis_module_window_active " #I#{?#{!=:#{window_name},Window}, #W,} "

# Window status styling
set -g window-status-last-style "bg=#{@thm_mantle},fg=#{@thm_primary_strong}"
set -g window-status-activity-style "bg=#{@thm_primary_strong},fg=#{@thm_core}"
set -g window-status-bell-style "bg=#{@thm_primary_strong},fg=#{@thm_core},bold"

# Agent state on each window tab, opt-in. keeptabs (https://github.com/uhs-robert/keeptabs)
# sets the window option @keeptabs_state and flips the global @keeptabs_frame.
set -ogq @oasis_window_agents "off"
set -ogq @oasis_agent_running_icon "\363\260\232\251"
set -ogq @oasis_agent_waiting_icon "\363\260\202\236"
set -ogq @oasis_agent_done_icon "\363\260\227\240"
set -ogq @oasis_agent_idle_icon "\363\261\231\272"
set -ogq @oasis_agent_icon_alt "\363\261\232\243"
set -ogq @oasis_agent_running_color "#{@thm_primary}"
set -ogq @oasis_agent_done_color "#{@thm_green}"
set -ogq @oasis_agent_waiting_color "#{@thm_yellow}"
set -ogq @oasis_agent_idle_color "#{@thm_border}"

# Built here, not by the user: read through #{E:} so their commas stay out of the tab's #{?}
set -g @oasis_window_agent_colour "#{?#{==:#{@keeptabs_state},waiting},#{E:@oasis_agent_waiting_color},#{?#{==:#{@keeptabs_state},done},#{E:@oasis_agent_done_color},#{?#{==:#{@keeptabs_state},running},#{E:@oasis_agent_running_color},#{E:@oasis_agent_idle_color}}}}"
set -g @oasis_window_agent_glyph "#{?#{==:#{@keeptabs_state},waiting},#{@oasis_agent_waiting_icon},#{?#{==:#{@keeptabs_state},done},#{@oasis_agent_done_icon},#{?#{==:#{@keeptabs_state},running},#{?#{==:#{@keeptabs_frame},1},#{@oasis_agent_icon_alt},#{@oasis_agent_running_icon}},#{@oasis_agent_idle_icon}}}}"
