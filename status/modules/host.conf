# status/modules/host.conf
# vim:set ft=tmux:
# Short hostname, coloured by @oasis_host_states

# User configurable settings
set -ogq @oasis_host_icon "\363\260\222\213 "
# Space-separated glob=state pairs, state being warn or crit; the first match wins, no match is ok
set -ogq @oasis_host_states ""

set -ogq @oasis_module_host "#{@oasis_host_icon}#h"
# #{q:} shell-escapes the hostname so it cannot run as a command; the script reads the states itself.
# No script runs while @oasis_host_states is empty.
set -ogq @oasis_module_host_state "#{?#{@oasis_host_states},#(bash \"#{@oasis_scripts_dir}/host.sh\" state #{q:host_short}),ok}"
