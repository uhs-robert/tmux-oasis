# status/modules/battery.conf
# vim:set ft=tmux:
# Charge level of the laptop battery. Hidden without one and while fully charged.

# User configurable settings
set -ogq @oasis_battery_icons "\357\211\204 \357\211\203 \357\211\202 \357\211\201 \357\211\200" # Five icons, empty to full
set -ogq @oasis_battery_charging_icon "\357\207\246"
set -ogq @oasis_battery_warn "50" # warn state at or below this percent
set -ogq @oasis_battery_crit "20" # crit state at or below this percent

set -ogq @oasis_module_battery '#(bash #{q:@oasis_scripts_dir}/battery.sh text x#{q:@oasis_battery_icons} x#{q:@oasis_battery_charging_icon})'
set -ogq @oasis_module_battery_when '#{!=:#(bash #{q:@oasis_scripts_dir}/battery.sh text x#{q:@oasis_battery_icons} x#{q:@oasis_battery_charging_icon}),}'
set -ogq @oasis_module_battery_state '#(bash #{q:@oasis_scripts_dir}/battery.sh state x#{q:@oasis_battery_warn} x#{q:@oasis_battery_crit})'
