# status/modules/load.conf
# vim:set ft=tmux:
# 1-minute load average, state relative to the core count

# User configurable settings
set -ogq @oasis_load_icon "\363\260\212\232 "
set -ogq @oasis_load_warn "0.7" # Multiples of the core count
set -ogq @oasis_load_crit "1.0"

set -ogq @oasis_module_load '#{@oasis_load_icon}#(bash #{q:@oasis_scripts_dir}/load.sh display)'
set -ogq @oasis_module_load_when '#(bash #{q:@oasis_scripts_dir}/load.sh display)'
set -ogq @oasis_module_load_state '#(bash #{q:@oasis_scripts_dir}/load.sh state)'
