# status/modules/uptime.conf
# vim:set ft=tmux:
# System uptime, e.g. 3d 4h

# User configurable settings
set -ogq @oasis_uptime_icon "\363\260\224\237 "

set -ogq @oasis_module_uptime '#{@oasis_uptime_icon}#(bash #{q:@oasis_scripts_dir}/uptime.sh text)'
set -ogq @oasis_module_uptime_when '#(bash #{q:@oasis_scripts_dir}/uptime.sh text)'
