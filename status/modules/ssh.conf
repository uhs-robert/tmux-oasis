# status/modules/ssh.conf
# vim:set ft=tmux:
# Remote host while the active pane runs ssh

# User configurable settings
set -ogq @oasis_ssh_icon "\363\260\243\200 "

# #{q:} shell-escapes the tty so a hostile value cannot run as a command
set -ogq @oasis_module_ssh "#{@oasis_ssh_icon}#(bash #{q:@oasis_scripts_dir}/ssh.sh host #{q:pane_tty})"
set -ogq @oasis_module_ssh_when "#{==:#{pane_current_command},ssh}"
