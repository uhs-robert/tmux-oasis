# status/modules/disk.conf
# vim:set ft=tmux:
# Used percent of one filesystem

# User configurable settings
set -ogq @oasis_disk_icon "󰋊 "
set -ogq @oasis_disk_path "/"
set -ogq @oasis_disk_warn "80" # Percent
set -ogq @oasis_disk_crit "90"

set -ogq @oasis_module_disk '#{@oasis_disk_icon}#(bash "#{@oasis_scripts_dir}/disk.sh" display)'
set -ogq @oasis_module_disk_when '#(bash "#{@oasis_scripts_dir}/disk.sh" display)'
set -ogq @oasis_module_disk_state '#(bash "#{@oasis_scripts_dir}/disk.sh" state)'
