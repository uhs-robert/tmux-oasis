# status/modules/git.conf
# vim:set ft=tmux:
# Branch of the active pane's directory, with a marker for uncommitted changes. Hidden outside a repo.

# User configurable settings
set -ogq @oasis_git_icon "\356\202\240"
set -ogq @oasis_git_dirty_icon "*"

set -ogq @oasis_module_git '#(bash "#{@oasis_scripts_dir}/git.sh" text "#{pane_current_path}" "#{@oasis_git_icon}" "#{@oasis_git_dirty_icon}")'
set -ogq @oasis_module_git_when '#{!=:#(bash "#{@oasis_scripts_dir}/git.sh" text "#{pane_current_path}" "#{@oasis_git_icon}" "#{@oasis_git_dirty_icon}"),}'
