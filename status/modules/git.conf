# status/modules/git.conf
# vim:set ft=tmux:
# Branch of the active pane's directory, with a marker for uncommitted changes. Hidden outside a repo.

# User configurable settings
set -ogq @oasis_git_icon "\356\202\240"
set -ogq @oasis_git_dirty_icon "*"

# #{q:} shell-quotes the path: directory names are untrusted input to the shell that runs #()
set -ogq @oasis_module_git '#(bash #{q:@oasis_scripts_dir}/git.sh text #{q:pane_current_path})'
set -ogq @oasis_module_git_when '#{!=:#(bash #{q:@oasis_scripts_dir}/git.sh text #{q:pane_current_path}),}'
