# status/modules/network.conf
# vim:set ft=tmux:
# Main IPv4 address, with a marker while a WireGuard or Tailscale interface is up. Hidden without an address.

# User configurable settings
set -ogq @oasis_network_icon "\357\202\254 "
set -ogq @oasis_network_vpn_icon "\357\200\243" # Icon or text after the address, empty for none
set -ogq @oasis_network_show_interface "off" # "on" adds the interface name after the address

# #{q:} shell-quotes the scripts directory, as for any value interpolated into #()
set -ogq @oasis_module_network '#(bash #{q:@oasis_scripts_dir}/network.sh text)'
set -ogq @oasis_module_network_when '#{!=:#(bash #{q:@oasis_scripts_dir}/network.sh text),}'
