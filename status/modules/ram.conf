# status/modules/ram.conf
# vim:set ft=tmux:
# Used memory percent

# User configurable settings
set -ogq @oasis_ram_icon " "
set -ogq @oasis_ram_warn "80" # Percent
set -ogq @oasis_ram_crit "90"

set -ogq @oasis_module_ram '#{@oasis_ram_icon}#(bash "#{@oasis_scripts_dir}/ram.sh" display)'
set -ogq @oasis_module_ram_when '#(bash "#{@oasis_scripts_dir}/ram.sh" display)'
set -ogq @oasis_module_ram_state '#(bash "#{@oasis_scripts_dir}/ram.sh" state)'
