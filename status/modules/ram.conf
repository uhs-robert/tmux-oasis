# status/modules/ram.conf
# vim:set ft=tmux:
# Used memory percent

# User configurable settings
set -ogq @oasis_ram_icon "\356\277\205 "
set -ogq @oasis_ram_warn "80" # Percent
set -ogq @oasis_ram_crit "90"

set -ogq @oasis_module_ram '#{@oasis_ram_icon}#(bash #{q:@oasis_scripts_dir}/ram.sh display)'
set -ogq @oasis_module_ram_when '#(bash #{q:@oasis_scripts_dir}/ram.sh display)'
set -ogq @oasis_module_ram_state '#(bash #{q:@oasis_scripts_dir}/ram.sh state)'
