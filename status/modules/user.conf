# status/modules/user.conf
# vim:set ft=tmux:
# Login name of the user who started the tmux server. Hidden on tmux versions without #{user}.

# User configurable settings
set -ogq @oasis_user_icon "\363\260\200\204 "

# A format, so no process runs per redraw. It is the server's user, not the active pane's.
set -ogq @oasis_module_user "#{@oasis_user_icon}#{user}"
set -ogq @oasis_module_user_when "#{!=:#{user},}"
