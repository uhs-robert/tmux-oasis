# status/modules/kube.conf
# vim:set ft=tmux:
# Current kubectl context, plus the namespace unless it is "default". Hidden without a kubeconfig that sets one.

# User configurable settings
set -ogq @oasis_kube_icon "\363\261\203\276"
set -ogq @oasis_kube_namespace "auto" # "auto" hides the default namespace, "always" shows it, "never" hides the namespace

# #{q:} shell-quotes the scripts directory, as for any value interpolated into #()
set -ogq @oasis_module_kube '#(bash #{q:@oasis_scripts_dir}/kube.sh text)'
set -ogq @oasis_module_kube_when '#{!=:#(bash #{q:@oasis_scripts_dir}/kube.sh text),}'
