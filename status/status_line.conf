# status/status_line.conf
# vim:set ft=tmux:
# Main status line assembly

# General status line configuration
set -g status-style "bg=#{@thm_mantle},fg=#{@thm_secondary}"
set -g status-justify "left" # Window positioning

# Directory of the data scripts that modules call, e.g. #(bash "#{@oasis_scripts_dir}/x.sh")
set -gF @oasis_scripts_dir "#{d:current_file}/scripts"

# Colours for modules whose _state evaluates to warn or crit: the module text in a
# surface group, the whole group background in an accent group
set -ogq @oasis_state_warn_color "#{@thm_yellow}"
set -ogq @oasis_state_crit_color "#{@thm_red}"

# Source mode indicators (modules depend on this)
source -F "#{d:current_file}/mode_indicators.conf"

# Source individual modules
source -F "#{d:current_file}/modules/mode.conf"
source -F "#{d:current_file}/modules/session.conf"
source -F "#{d:current_file}/modules/folder.conf"
source -F "#{d:current_file}/modules/clock.conf"
source -F "#{d:current_file}/modules/sync.conf"
source -F "#{d:current_file}/modules/load.conf"
source -F "#{d:current_file}/modules/ram.conf"
source -F "#{d:current_file}/modules/cpu.conf"
source -F "#{d:current_file}/modules/disk.conf"
source -F "#{d:current_file}/modules/host.conf"
source -F "#{d:current_file}/modules/ssh.conf"
source -F "#{d:current_file}/modules/windows.conf"

# Status line layout: "|" separates groups, spaces separate modules within a group.
# Groups alternate accent and surface colours, starting with accent at the screen edge.
set -ogq @oasis_status_left "mode | session"
set -ogq @oasis_status_right "sync | folder | clock"

# Separator between groups: "powerline", "round", "slant" or "flat".
# @oasis_separator_left / @oasis_separator_right override the glyphs directly.
set -ogq @oasis_separator "powerline"
set -ogq @oasis_separator_module " "

# Window pill caps, independent of the bar: "round", "powerline", "slant" or "flat".
# @oasis_window_separator_left / @oasis_window_separator_right override the glyphs directly.
set -ogq @oasis_window_separator "round"

set -g status-left-length 100
set -g status-right-length 100
run-shell 'bash "#{d:current_file}/build_status.sh"'
